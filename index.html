<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML to DOCX Converter with Math 20</title>
    <meta name="description" content="An advanced full-stack application to convert rich HTML files containing Tailwind CSS styles and Math (MathML/LaTeX) equations into Microsoft Word native DOCX files, preserving math layouts and style sheets." />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2563EB" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("[Service Worker] Registered successfully:", reg.scope))
            .catch((err) => console.error("[Service Worker] Registration failed:", err));
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
