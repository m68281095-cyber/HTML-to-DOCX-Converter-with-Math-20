    <rect x="128" y="100" width="256" height="312" rx="16" fill="url(#blueGrad)" />
    
    <!-- Decorative page fold/lines -->
    <rect x="168" y="150" width="176" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.6" />
    <rect x="168" y="186" width="176" height="12" rx="6" fill="#FFFFFF" fill-opacity="0.6" />
    
    <!-- Central math formula box visual -->
    <rect x="168" y="235" width="176" height="130" rx="12" fill="#1E293B" />
    
    <!-- Math sigma symbol -->
    <path d="M 230 265 L 282 265 L 282 277 L 244 300 L 282 323 L 282 335 L 230 335 L 230 323 L 264 323 L 237 300 L 264 277 L 230 277 Z" fill="url(#goldGrad)" />
